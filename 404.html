<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <meta name="theme-color" content="#161616" />
    <style>
        body{background:#161616;color:#ecf0f1;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;text-align:center}
        .error{max-width:500px;padding:40px}
        h1{font-size:6rem;margin:0;background:linear-gradient(135deg,#e74c3c,#f1948a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .btn{display:inline-block;padding:14px 36px;margin-top:20px;background:#e74c3c;color:#fff;text-decoration:none;border-radius:40px;transition:transform .2s;font-weight:600}
        .btn:hover{transform:scale(1.05)}
        p{color:#b0b8be}
        .muted{color:#7a8288}
    </style>
</head>
<body>
    <div class="error">
        <h1>404</h1>
        <p style="font-size:1.5rem;">Страница не найдена</p>
        <p class="muted">Возможно, она была перемещена или удалена</p>
        <a href="index.html" class="btn">← На главную</a>
    </div>
</body>
</html>
