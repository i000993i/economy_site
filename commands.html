rder-color:rgba(231,76,60,0.15)}.category-top{background:rgba(241,196,15,0.12);color:#f1c40f;border-color:rgba(241,196,15,0.15)}.category-profile{background:rgba(52,73,94,0.15);color:#b0b8be;border-color:rgba(52,73,94,0.1)}.category-bonus{background:rgba(241,196,15,0.12);color:#f1c40f;border-color:rgba(241,196,15,0.15)}.category-giveaway{background:rgba(231,76,60,0.08);color:#e74c3c;border-color:rgba(231,76,60,0.1)}.category-other{background:rgba(52,73,94,0.1);color:#7f8c8d;border-color:rgba(52,73,94,0.08)}.cmd-count{color:#6a737b;font-size:.75rem;margin-top:12px;text-align:right}.pagination{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}.pagination button{padding:6px 14px;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.2);border-radius:20px;color:#ecf0f1;cursor:pointer;transition:all .2s;font-size:.85rem}.pagination button:hover{background:rgba(231,76,60,0.2)}.pagination button.active{background:#e74c3c;border-color:#e74c3c;color:#fff}@media(max-width:900px){.commands-table{font-size:.8rem}.commands-table td,.commands-table th{padding:6px 8px}.commands-table .cmd{font-size:.78rem}}@media(max-width:768px){.commands-table{font-size:.75rem}.commands-table td,.commands-table th{padding:5px 6px}.commands-table .cmd{font-size:.72rem}.commands-table .aliases{font-size:.65rem}.commands-table .desc{font-size:.72rem}.commands-table .category{font-size:.6rem;padding:1px 8px}}@media(max-width:480px){.commands-table{display:block;overflow-x:auto;white-space:nowrap}.commands-table td,.commands-table th{padding:4px 6px;font-size:.7rem}.commands-table .cmd{font-size:.68rem;min-width:50px}.commands-table .aliases{font-size:.6rem}.commands-table .desc{font-size:.68rem}.commands-table .category{font-size:.55rem;padding:1px 6px}.search-wrap input{font-size:.85rem;padding:8px 14px}}</style>
    
    <link rel="preload" href="style.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
    <div class="bg-gradient" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <div class="container">
        <nav class="navbar">
            <a href="index.html">Главная</a>
            <a href="commands.html" class="active">Команды</a>
            <a href="donate.html">Донаты</a>
        </nav>

        <header class="header">
            <h1>⚡ Команды бота</h1>
            <div class="subtitle">Полный список доступных команд</div>
        </header>

        <section class="section">
            <div class="search-wrap">
                <input type="text" id="cmdSearch" placeholder="🔍 Поиск команд..." oninput="filterCommands()" />
            </div>

            <div style="overflow-x:auto;">
                <table class="commands-table">
                    <thead>
                        <tr><th>Команда</th><th>Алиасы</th><th>Описание</th><th>Категория</th></tr>
                    </thead>
                    <tbody id="commandsBody"></tbody>
                </table>
            </div>
            
            <div class="cmd-count">
                Всего команд: <span id="cmdCount">0</span>
            </div>
            
            <div class="pagination" id="pagination"></div>
        </section>

        <footer class="footer">
            <span>© 2024-2026 · <a href="#" class="footer-link">DBScommunity</a></span>
            <a href="https://t.me/DBScommunityOffice" target="_blank" rel="noopener noreferrer" class="telegram-icon" title="Telegram канал DBScommunity">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </a>
        </footer>
    </div>

    <script src="data/commands.js"></script>
    <script>
    (function() {
        const ROWS_PER_PAGE = 15;
        let currentPage = 1;
        let filteredData = [];

        function getCategoryClass(category) {
            return CATEGORY_CLASS_MAP[category] || 'category-other';
        }

        function renderPage() {
            const tbody = document.getElementById('commandsBody');
            const start = (currentPage - 1) * ROWS_PER_PAGE;
            const end = Math.min(start + ROWS_PER_PAGE, filteredData.length);
            const pageData = filteredData.slice(start, end);

            tbody.innerHTML = pageData.length ? pageData.map(cmd => `
                <tr>
                    <td class="cmd">${cmd.cmd}</td>
                    <td class="aliases">${cmd.aliases || '—'}</td>
                    <td class="desc">${cmd.desc}</td>
                    <td><span class="category ${getCategoryClass(cmd.category)}">${cmd.category}</span></td>
                </tr>
            `).join('') : `<tr><td colspan="4" style="text-align:center;color:#6a737b;padding:20px;">Команды не найдены</td></tr>`;

            document.getElementById('cmdCount').textContent = filteredData.length;
            renderPagination();
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            container.innerHTML = html;
        }

        window.goToPage = function(page) {
            currentPage = page;
            renderPage();
            document.getElementById('commandsBody').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        window.filterCommands = function() {
            const input = document.getElementById('cmdSearch');
            const filter = input.value.toLowerCase().trim();
            
            filteredData = COMMANDS_DATA.filter(cmd => {
                if (!filter) return true;
                return (cmd.cmd + ' ' + cmd.aliases + ' ' + cmd.desc + ' ' + cmd.category)
                    .toLowerCase().includes(filter);
            });
            
            currentPage = 1;
            renderPage();
        };

        document.addEventListener('DOMContentLoaded', function() {
            filteredData = [...COMMANDS_DATA];
            renderPage();
        });
    })();
    </script>
    <script src="javascript.js" defer></script>
</body>
</html>
